<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>æ-æ-æ-tchi</title>
  <meta name="description" content="A pocket tamagotchi that runs on real data about the California sea lion.">
  <meta property="og:title" content="æ-æ-æ-tchi">
  <meta property="og:description" content="A pocket tamagotchi that runs on real data about the California sea lion.">
  <meta property="og:image" content="img/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="img/favicon.png">
  <link rel="preload" href="fonts/pixelify-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-off">
  <main id="app">
    <section id="device" aria-label="Pixel tamagotchi">
      <canvas id="shell" width="128" height="160" aria-hidden="true"></canvas>
      <div id="lcdWrap"><canvas id="lcd" width="128" height="96" role="img" aria-label=""></canvas></div>
      <button class="hw" id="btnPower" type="button" aria-label="Power"></button>
      <button class="hw" id="btnL" type="button" aria-label="Back"></button>
      <button class="hw" id="btnM" type="button" aria-label="Select"></button>
      <button class="hw" id="btnR" type="button" aria-label="Next"></button>
    </section>

    <aside id="panel">
      <div id="pHead">
        <p id="mast">æ-æ-æ-tchi</p>
        <button id="soundBtn" class="btn-text" type="button"></button>
      </div>
      <div id="pMain" aria-live="polite">
        <h1 id="pTitle"></h1>
        <div id="pText"></div>
        <div id="pName" hidden>
          <label id="nameLabel" for="petName"></label>
          <input id="petName" type="text" maxlength="12" autocomplete="off" spellcheck="false">
          <div id="pAfter"></div>
        </div>
        <div id="pNotes"></div>
        <button id="againBtn" class="btn-text" type="button" hidden></button>
      </div>
      <div id="pMeters" hidden>
        <h2 id="metersTitle"></h2>
        <div id="meterList"></div>
      </div>
      <div id="pKeys">
        <div class="keys">
          <button id="kL" class="key" type="button"><span aria-hidden="true">◀</span></button>
          <button id="kM" class="key" type="button"><span aria-hidden="true">●</span></button>
          <button id="kR" class="key" type="button"><span aria-hidden="true">▶</span></button>
        </div>
        <p id="keyHint"></p>
      </div>
    </aside>
  </main>

  <script src="js/sprites.gen.js"></script>
  <script src="js/copy.js"></script>
  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/games.js"></script>
  <script src="js/story.js"></script>
</body>
</html>
